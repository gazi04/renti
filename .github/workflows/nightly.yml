name: nightly

# Slow, high-signal checks that would add too much latency to every PR. They run
# once a day and, on a scheduled failure, open/append a single tracking issue.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  postgres-feature:
    name: Full Feature suite on Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: rentacar_test
          POSTGRES_USER: rentacar_test
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: rentacar_test
      DB_USERNAME: rentacar_test
      DB_PASSWORD: secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-app
        with:
          # Page-rendering tests need public/build/manifest.json.
          node: "true"
          build: "true"
          flux-username: ${{ secrets.FLUX_USERNAME }}
          flux-license-key: ${{ secrets.FLUX_LICENSE_KEY }}
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force
      - name: Feature suite (Postgres)
        run: php artisan test --testsuite=Feature

  mutation:
    name: Mutation testing
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-app
        with:
          # Page-rendering tests need public/build/manifest.json.
          node: "true"
          build: "true"
          flux-username: ${{ secrets.FLUX_USERNAME }}
          flux-license-key: ${{ secrets.FLUX_LICENSE_KEY }}
          coverage: pcov
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Pest mutation suite
        run: composer test:mutation

  code-health:
    name: Rector + unused dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-app
        with:
          flux-username: ${{ secrets.FLUX_USERNAME }}
          flux-license-key: ${{ secrets.FLUX_LICENSE_KEY }}
      - name: Rector (dry run)
        run: composer refactor:check
      - name: Unused Composer dependencies
        if: ${{ !cancelled() }}
        run: composer deps:unused

  report:
    name: Report nightly failure
    needs: [postgres-feature, mutation, code-health]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const results = {
              'postgres-feature': '${{ needs.postgres-feature.result }}',
              'mutation': '${{ needs.mutation.result }}',
              'code-health': '${{ needs.code-health.result }}',
            };
            const failed = Object.entries(results)
              .filter(([, r]) => r === 'failure')
              .map(([n]) => n);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `Nightly run failed: ${runUrl}`,
              '',
              `Failed jobs: ${failed.join(', ') || 'unknown'}`,
              '',
              '_Auto-generated by the `nightly` workflow._',
            ].join('\n');
            const title = 'Nightly CI failure';
            const { data: search } = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}"`,
            });
            if (search.total_count > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: search.items[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
